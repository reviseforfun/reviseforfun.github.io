<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e1a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Flashcards, quizzes, revision games, a focus timer and a planner. CyberRevision makes revision click.">
  <title>CyberRevision</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.7 3.4a2.5 2.5 0 0 1-4.3 1.2L14.5 15h-5l-2.4 2.6a2.5 2.5 0 0 1-4.3-1.2L2.1 13A5 5 0 0 1 7 7z"/><path d="M8 10v3M6.5 11.5h3M15.5 11h.01M17.5 12.5h.01"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18M7.5 13.5l2 2 4-4"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-4-3-6.5-4-10-2.5 2-3 4-3 6-1.5-1-2-2.5-2-4C7 9 5 11.5 5 15a7 7 0 0 0 7 7z"/></symbol>
  </svg>
  <div class="splash" id="splash" hidden><video id="splash-video" src="loader.mp4" muted playsinline preload="auto" aria-label="CyberRevision loading"></video><span>Tap to skip</span></div>
  <a class="skip-link" href="#content">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="CyberRevision home">
      <img src="logo.svg" alt="" width="40" height="40">
      <span><b>Cyber</b>Revision<small>MAKE IT CLICK</small></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="#home" data-page="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#create" data-page="create"><svg><use href="#i-plus"/></svg><span>Create</span></a>
      <a href="#games" data-page="games"><svg><use href="#i-game"/></svg><span>Arcade</span></a>
      <a href="#planner" data-page="planner"><svg><use href="#i-plan"/></svg><span>Planner</span></a>
      <a href="#timer" data-page="timer"><svg><use href="#i-timer"/></svg><span>Focus</span><em id="nav-timer" hidden></em></a>
      <a href="#chat" data-page="chat"><svg><use href="#i-chat"/></svg><span>Chat</span></a>
      <a href="#account" data-page="account"><svg><use href="#i-user"/></svg><span>Account</span></a>
    </nav>
    <div class="streak-card" id="streak-card">
      <svg><use href="#i-flame"/></svg>
      <div><strong id="streak-days">0 days</strong><small id="streak-note">Study today to start a streak</small></div>
    </div>
    <div class="profile">
      <span class="avatar" id="avatar">?</span>
      <div><strong id="username">Guest</strong><small id="user-note">Not signed in</small></div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode"><svg><use href="#i-moon"/></svg></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <a class="mobile-brand" href="#home" aria-label="CyberRevision home"><img src="logo.svg" alt="" width="32" height="32"><span><b>Cyber</b>Revision</span></a>
      <h2 id="page-title">Home</h2>
      <div class="topbar-actions">
        <span class="pill streak-pill" id="streak-pill" title="Daily study streak"><svg><use href="#i-flame"/></svg><b id="streak-count">0</b></span>
        <button class="icon-button mobile-only" id="theme-toggle-mobile" type="button" aria-label="Switch to dark mode"><svg><use href="#i-moon"/></svg></button>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
    <footer>CyberRevision · Learn a little, every day.</footer>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
